# SPDX-License-Identifier: GPL-3.0-or-later
#
# Cross-Platform ab Commit eins. Nicht "spaeter ergaenzen": der Moment, in dem
# eine Plattform drei Wochen nicht gebaut wurde, ist der Moment, in dem sie
# kaputt ist.
#
# macOS laeuft mit, obwohl es kein Testgeraet gibt. Ein gruener Build ist keine
# Zusage, dass es dort gut laeuft — aber ein roter Build ist der Beweis, dass
# es das nicht tut.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Doku baut ohne fehlende Verweise
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  licenses:
    name: Lizenzen und Sicherheitshinweise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  msrv:
    name: Mindest-Rust-Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features
